name: arber
description: Arb Excel translator

publish_to: 'none'

version: 1.2.5+21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  rive: ^0.14.7

  file_picker: ^12.0.0-beta.3
  excel:
    git:
      url: https://github.com/justkawal/excel
      ref: 37e0807f97fe8c293bdf75441cf21413b322882d

  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5

  dio: ^5.9.2

  window_manager: ^0.5.1
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    image: true

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
