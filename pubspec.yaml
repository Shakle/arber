name: arber
description: Arb Excel translator

publish_to: 'none'

version: 1.3.1+24

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.7.0

  rive: ^0.14.11

  file_picker: ^13.1.0
  excel_community: ^2.6.0

  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6

  dio: ^5.11.1

  window_manager: ^0.5.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.2
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    image: true

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
